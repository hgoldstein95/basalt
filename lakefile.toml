name = "basalt"
version = "0.1.0"
defaultTargets = ["Basalt", "BasaltExamples", "BasaltTest"]

[[lean_lib]]
name = "Basalt"
globs = ["Basalt", "Basalt.+"]

[[lean_lib]]
name = "BasaltExamples"
globs = ["BasaltExamples.+"]

[[lean_lib]]
name = "BasaltTest"
globs = ["BasaltTest.+"]

[[lean_lib]]
name = "BasaltExperiments"
globs = ["BasaltExperiments.+"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0-rc1"

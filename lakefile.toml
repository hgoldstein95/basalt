name = "basalt"
version = "0.1.0"
defaultTargets = ["Basalt", "BasaltExamples", "BasaltTest"]

[[lean_lib]]
name = "Basalt"
globs = ["Basalt", "Basalt.+"]

[[lean_lib]]
name = "BasaltExamples"
globs = ["BasaltExamples.+"]

[[lean_lib]]
name = "BasaltTest"
globs = ["BasaltTest.+"]
# `#genstats` on tuned generators runs deep interpreter recursion; the Lean
# 4.29.1 interpreter's default C-stack is smaller than 4.31+, so raise it here.
weakLeanArgs = ["--tstack=1000000"]

[[lean_lib]]
name = "BasaltExperiments"
globs = ["BasaltExperiments.+"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"
